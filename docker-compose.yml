services:

  db:
    image: postgres:15
    container_name: coreinventory-db
    environment:
      POSTGRES_DB: coreinventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coreinventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    container_name: coreinventory-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/coreinventory
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    container_name: coreinventory-frontend
    ports:
      - "8081:80"
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: coreinventory-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server

volumes:
  postgres_data: